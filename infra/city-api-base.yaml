AWSTemplateFormatVersion: "2010-09-09"
Description: Shared production base resources for one city-specific transit API

Parameters:
  City:
    Type: String
    AllowedValues:
      - nagoya
      - sendai

Resources:
  CityGtfsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${City}go-api"
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256

  ApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadCityGtfsBundle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${CityGtfsBucket.Arn}/gtfs/${City}/*"

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${City}go-api"
      RetentionInDays: 14

Outputs:
  City:
    Value: !Ref City
  EcrRepositoryName:
    Value: !Ref ApiRepository
  EcrRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  GtfsBucketName:
    Value: !Ref CityGtfsBucket
  ApiExecutionRoleArn:
    Value: !GetAtt ApiExecutionRole.Arn
  LambdaFunctionName:
    Value: !Sub "${City}go-api"
