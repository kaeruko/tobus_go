[package]
name = "transit-search-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[lib]
name = "_transit_search_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py311"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
