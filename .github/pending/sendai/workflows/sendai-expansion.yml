name: Sendai municipal bulk integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sendai-expansion.yml'
      - 'api/sendai_operating_period.py'
      - 'api/sendai_practical_bundle.py'
      - 'api/app/sendai_practical_routes.py'
      - 'api/tests/test_sendai_arai21_practical.py'
      - 'api/tests/test_sendai_stage1.py'
      - 'api/tests/test_sendai_stage2.py'
      - 'api/tests/test_sendai_stage3.py'
      - 'api/tests/test_sendai_stage4.py'
      - 'api/tests/test_sendai_stage5.py'
      - 'api/tests/test_sendai_stage6.py'
      - 'api/tests/test_sendai_stage7.py'
      - 'api/tests/test_sendai_stage8.py'
      - 'api/tests/test_sendai_municipal_bulk.py'
      - 'api/tests/sendai_bulk_fixture.py'
      - 'api/sendai_shared_network.py'
      - 'api/tests/fixtures/sendai_subway/*bulk*.json'
      - 'scripts/review_sendai_municipal_bulk.py'
      - 'scripts/check_sendai_municipal_bulk.py'
      - 'scripts/check_sendai_bulk_reachability.py'
      - 'scripts/benchmark_sendai_municipal_bulk.py'
      - 'integration_test/sendai_bulk_chrome_test.dart'
      - 'api/tests/fixtures/sendai_subway/*stage5.json'
      - 'api/tests/fixtures/sendai_subway/*stage8.json'
      - 'integration_test/sendai_stage8_chrome_test.dart'
      - 'api/tests/fixtures/sendai_subway/*stage3.json'
      - 'lib/widgets/sendai_practical_launcher.dart'
      - 'test/sendai_practical_launcher_test.dart'
      - 'integration_test/sendai_stage3_chrome_test.dart'
      - 'api/tests/sendai_municipal_oracle.py'
      - 'api/tests/fixtures/sendai_subway/*stage1.json'
      - 'api/tests/fixtures/sendai_subway/*stage2.json'
      - 'scripts/check_sendai_expansion.py'
      - 'scripts/check_sendai_stage7_reachability.py'
      - 'scripts/check_sendai_stage8_reachability.py'
      - 'scripts/serve_sendai_practical_local.py'
      - 'lib/pages/sendai_practical_test_page.dart'
      - 'lib/models/sendai_practical_models.dart'
      - 'integration_test/sendai_stage1_chrome_test.dart'
      - 'integration_test/sendai_stage3_chrome_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-model:
    name: Reviewed municipal operator bulk network with existing subway links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install existing Python dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Six bulk-scope regression tests only
        working-directory: api
        run: python -B -m unittest -f tests.test_sendai_municipal_bulk
      - name: Prepare exactly the approved official GTFS and manifest
        run: |
          python -B scripts/fetch_sendai_gtfs.py \
            --output api/data/sendai/20261006_model \
            --expected-service-date 2026-10-16 \
            --source-url 'https://api-public.odpt.org/api/v4/files/odpt/SendaiMunicipal/bus_realtime_information.zip?date=20261006' \
            --expected-sha256 53a08400776b3229743b24eb53566eb523b354a5b783dcfffd3e40f39258e6a2
      - name: All approved raw rows and eleven fixed bulk conditions with existing oracle and API
        run: python -B scripts/check_sendai_municipal_bulk.py --bus-gtfs-dir api/data/sendai/20261006_model --expected-sha '${{ github.sha }}'
      - name: Fixed new-area independent reachability
        run: python -B scripts/check_sendai_bulk_reachability.py
      - name: Measure scope performance in separate processes
        run: python -B scripts/benchmark_sendai_municipal_bulk.py --bus-gtfs-dir api/data/sendai/20261006_model
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Chrome and matching driver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Start the explicit new-stage localhost test service
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/serve_sendai_practical_local.py \
            --bus-gtfs-dir api/data/sendai/20261006_model \
            --expected-service-date 2026-10-16 \
            --subway-published api/tests/fixtures/sendai_subway/published_20230701.json \
            --subway-review api/tests/fixtures/sendai_subway/practical_review_20261016.json \
            --municipal-review api/tests/fixtures/sendai_subway/municipal_review_20261017_bulk.json \
            --use-reviewed-operating-period --accept-experimental-transfer-model > "$RUNNER_TEMP/sendai-stage1-api.log" 2>&1 &
          server_pid=$!
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/test/sendai/capabilities > "$RUNNER_TEMP/sendai-stage1-capabilities.json"; then
              python -c 'import json,os; from pathlib import Path; v=json.loads((Path(os.environ["RUNNER_TEMP"])/"sendai-stage1-capabilities.json").read_text()); assert len(v["operating_dates"])==48 and "2026-11-30" in v["operating_dates"] and not {"2026-10-25","2026-11-22","2026-12-01"}.intersection(v["operating_dates"]) and {"sendai_bus:2005_50","sendai_bus:2041_0","sendai_bus:1155_0","sendai_bus:5227_10"}.issubset({r["id"] for r in v["stops"]}), v'
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/sendai-stage1-api.log"; exit 1; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/sendai-stage1-api.log"
          exit 1
      - name: Start Chrome driver
        shell: bash
        run: |
          set -euo pipefail
          echo 'CHROME_EXECUTABLE=${{ steps.chrome.outputs.chrome-path }}' >> "$GITHUB_ENV"
          '${{ steps.chrome.outputs.chromedriver-path }}' --port=4444 > "$RUNNER_TEMP/sendai-stage1-chromedriver.log" 2>&1 &
      - name: Bulk-scope routes through the existing inline form in Flutter Chrome
        run: |
          flutter drive -d web-server --browser-name=chrome \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/sendai_bulk_chrome_test.dart \
            --dart-define=SENDAI_TEST_API_BASE=http://127.0.0.1:8000
      - name: Show original diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/sendai-stage1-api.log"; then tail -n 100 "$RUNNER_TEMP/sendai-stage1-api.log"; fi
          if test -f "$RUNNER_TEMP/sendai-stage1-chromedriver.log"; then tail -n 100 "$RUNNER_TEMP/sendai-stage1-chromedriver.log"; fi
