name: One-shot Sendai iOS bundle ID sync

on:
  push:
    branches:
      - codex/yokohama-runtime-connection

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/yokohama-runtime-connection
          fetch-depth: 0

      - name: Replace exact Sendai iOS identifiers
        shell: python
        run: |
          from pathlib import Path

          path = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = path.read_text(encoding='utf-8')
          old = 'jp.cloxs.sendaigo'
          new = 'jp.cloxs.go.sendai'
          count = text.count(old)
          if count != 6:
              raise SystemExit(
                  f'Expected exactly 6 {old!r} occurrences in project.pbxproj, found {count}'
              )
          updated = text.replace(old, new)
          if updated.count(old) != 0:
              raise SystemExit('Old Sendai bundle identifier remains after replacement')
          if updated.count(new) < 6:
              raise SystemExit('New Sendai bundle identifier count is unexpectedly low')
          path.write_text(updated, encoding='utf-8')

      - name: Verify generated iOS project
        run: ruby scripts/configure_ios_flavors.rb --check

      - name: Commit generated project and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sync_sendai_bundle_id.yml
          git diff --check
          git add ios/Runner.xcodeproj/project.pbxproj
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: align Sendai iOS bundle ID'
          git push origin HEAD:codex/yokohama-runtime-connection
