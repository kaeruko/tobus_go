name: Sendai stage6 exact Arai16 inspection
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_sendai_stage6.py'
      - '.github/workflows/sendai-stage6-inspection.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Python dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Load exact approved source and manifest
        run: |
          python -B scripts/fetch_sendai_gtfs.py \
            --output api/data/sendai/20261006_model \
            --expected-service-date 2026-10-16 \
            --source-url 'https://api-public.odpt.org/api/v4/files/odpt/SendaiMunicipal/bus_realtime_information.zip?date=20261006' \
            --expected-sha256 53a08400776b3229743b24eb53566eb523b354a5b783dcfffd3e40f39258e6a2
      - name: Emit original route16 records and retained old-row fixture
        run: python -B scripts/inspect_sendai_stage6.py --bus-gtfs-dir api/data/sendai/20261006_model
