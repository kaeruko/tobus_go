name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked .env files
        shell: bash
        run: |
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo '::error::Tracked .env file detected. Keep secrets in local untracked files only.'
            printf '%s\n' "$tracked_env_files"
            exit 1
          fi

      - name: Validate Phase 8 PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/inspect_city_infra.ps1',
            'scripts/bootstrap_city_api.ps1',
            'scripts/deploy_api.ps1',
            'scripts/set_route_search_core.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }

  flutter:
    name: Flutter analyze and Android flavors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Verify generated iOS project is committed
        run: ruby scripts/configure_ios_flavors.rb --check

      - name: Build Tokyo Android flavor
        run: flutter build apk --debug --flavor tokyo --dart-define=APP_CITY=tokyo

      - name: Build Nagoya Android flavor
        run: flutter build apk --debug --flavor nagoya --dart-define=APP_CITY=nagoya

      - name: Build Sendai Android flavor
        run: flutter build apk --debug --flavor sendai --dart-define=APP_CITY=sendai

      - name: Build Yokohama Android flavor
        run: flutter build apk --debug --flavor yokohama --dart-define=APP_CITY=yokohama

  ios:
    name: iOS flavor builds and isolation
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify generated Xcode configurations
        run: ruby scripts/configure_ios_flavors.rb --check

      - name: Build Tokyo iOS flavor
        run: flutter build ios --simulator --debug --flavor tokyo --dart-define=APP_CITY=tokyo

      - name: Verify Tokyo iOS identity, privacy, ATS, and Firebase resource
        shell: bash
        run: |
          set -euo pipefail
          app='build/ios/iphonesimulator/Runner.app'
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'jp.cloxs.go.tokyo'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = '都営でGO'
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$app/Info.plist")"
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$app/Info.plist" >/dev/null 2>&1; then
            echo '::error::Tokyo iOS app must not enable NSAllowsArbitraryLoads'
            exit 1
          fi
          test -f "$app/GoogleService-Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$app/GoogleService-Info.plist")" = 'jp.cloxs.go.tokyo'
          test "$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$app/GoogleService-Info.plist")" = 'toeigo'

      - name: Build Nagoya iOS flavor
        run: flutter build ios --simulator --debug --flavor nagoya --dart-define=APP_CITY=nagoya

      - name: Verify Nagoya iOS identity and Firebase isolation
        shell: bash
        run: |
          app='build/ios/iphonesimulator/Runner.app'
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'jp.cloxs.nagoyago'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = '名古屋でGO'
          test ! -e "$app/GoogleService-Info.plist"

      - name: Build Sendai iOS flavor
        run: flutter build ios --simulator --debug --flavor sendai --dart-define=APP_CITY=sendai

      - name: Verify Sendai iOS identity and Firebase isolation
        shell: bash
        run: |
          app='build/ios/iphonesimulator/Runner.app'
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'jp.cloxs.go.sendai'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = '仙台でGO'
          test ! -e "$app/GoogleService-Info.plist"

  python:
    name: Python API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run API unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  rust-search-core:
    name: Rust SearchCore (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api/native/transit_search_core

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'maturin>=1.9.4,<2'

      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/transit_search_core/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path native/transit_search_core/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path native/transit_search_core/Cargo.toml

      - name: Build and install native wheel
        run: |
          python -m maturin build --release --locked \
            --manifest-path native/transit_search_core/Cargo.toml \
            --out native/transit_search_core/target/wheels
          python -c "from pathlib import Path; wheels=list(Path('native/transit_search_core/target/wheels').glob('*.whl')); assert len(wheels) == 1; print(f'native_wheel_bytes={wheels[0].stat().st_size}')"
          python -m pip install native/transit_search_core/target/wheels/*.whl

      - name: Run Python/Rust parity tests
        run: >-
          python -m unittest
          tests.test_route_search_golden
          tests.test_search_core_factory
          tests.test_route_engine_contract
          -v

      - name: Build Lambda image
        if: matrix.python-version == '3.11'
        run: |
          docker build -t tobus-go-route-core-test .
          docker image inspect --format='lambda_image_bytes={{.Size}}' tobus-go-route-core-test

      - name: Smoke-test native route search in Lambda image
        if: matrix.python-version == '3.11'
        run: |
          /usr/bin/time -f 'lambda_image_smoke_elapsed_seconds=%e' \
            docker run --rm --entrypoint python tobus-go-route-core-test -c \
            "from _transit_search_core import TransitSearchIndex; index=TransitSearchIndex(2,1,1,[0],[0],[0,2],[0,1],[600,620],[600,620]); pairs,_=index.search([True],595,[(0,0)],[(1,0)],'fastest',6,100,100,100,1.0); assert pairs[0][3] == 620"
