name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked .env files
        shell: bash
        run: |
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo '::error::Tracked .env file detected. Keep secrets in local untracked files only.'
            printf '%s\n' "$tracked_env_files"
            exit 1
          fi

      - name: Validate active PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/deploy_api.ps1',
            'scripts/build_aab.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }

      - name: Validate iOS localization script
        shell: bash
        run: sh -n scripts/generate_ios_localized_info_plist.sh

  flutter:
    name: Flutter analyze and Tokyo Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: python3 scripts/run_active_tests.py flutter

      - name: Verify generated iOS project is committed
        run: ruby scripts/configure_ios_flavors.rb --check

      - name: Build Tokyo Android flavor
        run: flutter build apk --debug --flavor tokyo --dart-define=APP_CITY=tokyo

  android-release:
    name: Tokyo Windows release AAB
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create validation-only release signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keystorePath = Join-Path $env:RUNNER_TEMP 'tobus-ci-release.jks'
          & keytool -genkeypair -keystore $keystorePath `
            -storepass 'ci-release-only' -keypass 'ci-release-only' `
            -alias 'ci-release' -keyalg RSA -keysize 2048 -validity 1 `
            -dname 'CN=CI build only, O=CLOXS, C=JP'
          if ($LASTEXITCODE -ne 0) {
            throw "keytool failed with exit code $LASTEXITCODE."
          }
          $properties = @(
            'storePassword=ci-release-only'
            'keyPassword=ci-release-only'
            'keyAlias=ci-release'
            ('storeFile=' + $keystorePath.Replace('\', '/'))
          )
          $properties | Set-Content -LiteralPath android/key.properties -Encoding utf8

      - name: Build Tokyo release AAB through the Windows script
        shell: pwsh
        env:
          # This validation AAB is never uploaded and uses no production keys.
          GOOGLE_MAPS_ANDROID_API_KEY: ci-build-check-only
        run: ./scripts/build_aab.ps1 -City tokyo

      - name: Verify pending test plugins are absent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content -LiteralPath .flutter-plugins-dependencies -Raw |
            ConvertFrom-Json -Depth 100
          $pending = @($metadata.plugins.android | Where-Object { $_.name -eq 'integration_test' })
          if ($pending.Count -ne 0) {
            throw 'The pending integration_test plugin entered the Tokyo dependency graph.'
          }
          $registrant = 'android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java'
          if (Select-String -LiteralPath $registrant -Pattern 'IntegrationTestPlugin' -Quiet) {
            throw 'The Tokyo release registrant contains the pending IntegrationTestPlugin.'
          }

  ios:
    name: Tokyo iOS build and isolation
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify generated Xcode configurations
        run: ruby scripts/configure_ios_flavors.rb --check

      - name: Build Tokyo iOS flavor
        run: flutter build ios --simulator --debug --flavor tokyo --dart-define=APP_CITY=tokyo

      - name: Verify Tokyo iOS identity, privacy, ATS, and Firebase resource
        shell: bash
        run: |
          set -euo pipefail
          app='build/ios/iphonesimulator/Runner.app'
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'jp.cloxs.go.tokyo'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = '都営でGO'
          localized_en="$app/en.lproj/InfoPlist.strings"
          localized_ja="$app/ja.lproj/InfoPlist.strings"
          test -f "$localized_en"
          test -f "$localized_ja"
          grep -Fq '"CFBundleDisplayName" = "Toei GO";' "$localized_en"
          grep -Fq '"NSLocationWhenInUseUsageDescription" = "Used to show your current location on the map.";' "$localized_en"
          grep -Fq '"CFBundleDisplayName" = "都営でGO";' "$localized_ja"
          grep -Fq '"NSLocationWhenInUseUsageDescription" = "地図で現在地を表示するために使用します。";' "$localized_ja"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$app/Info.plist")"
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$app/Info.plist" >/dev/null 2>&1; then
            echo '::error::Tokyo iOS app must not enable NSAllowsArbitraryLoads'
            exit 1
          fi
          test -f "$app/GoogleService-Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$app/GoogleService-Info.plist")" = 'jp.cloxs.go.tokyo'
          test "$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$app/GoogleService-Info.plist")" = 'toeigo'

  python:
    name: Python API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            scripts/requirements_explore_cms.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r ../scripts/requirements_explore_cms.txt

      - name: Run API unit tests
        run: python ../scripts/run_active_tests.py python

  windows-shared-probe:
    name: Windows shared-network probe
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Windows read-only gates and shared regressions
        env:
          PYTHONPATH: tests
        run: python -m unittest tests.test_gtfs_streaming tests.test_tokyo_odpt_local_check tests.test_odpt_ordered_train_clocks tests.test_tokyo_gtfs_local_check tests.test_tokyo_pickup_contract tests.test_tokyo_compiled_routes_local_check tests.test_tokyo_dataset_bus_choices tests.test_tokyo_dataset_rail_choices tests.test_tokyo_rail_interval_audit tests.test_tokyo_bound_projection_audit tests.test_tokyo_destination_bounds_audit tests.test_tokyo_time_rounding tests.test_tokyo_time_rounding_audit tests.test_tokyo_time_projection_proof tests.test_tokyo_time_projection_proof_local tests.test_tokyo_search_correctness_audit tests.test_city_v2_delegation -f -v

  shared-v2:
    name: Shared SearchCore v2 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Common v2 delegation and Tokyo regressions
        run: python -m unittest tests.test_route_engine_contract tests.test_route_search_golden tests.test_transit_search_labels tests.test_transit_network tests.test_city_v2_delegation -f -v
      - name: Build Lambda image without unused v1 native extension
        if: matrix.python-version == '3.11'
        run: docker build -t tobus-go-route-core-test .
      - name: Check shared v2 imports in Lambda image
        if: matrix.python-version == '3.11'
        run: docker run --rm --entrypoint python tobus-go-route-core-test -c "import transit_search_labels, transit_timetable_choices, tokyo_search_labels; assert transit_timetable_choices.search_labels is transit_search_labels.search_labels; assert tokyo_search_labels._shared_search_labels is transit_search_labels.search_labels"
