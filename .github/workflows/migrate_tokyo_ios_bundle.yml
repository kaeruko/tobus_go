name: Migrate Tokyo iOS Bundle ID

on:
  push:
    branches:
      - fix/issue-155-tokyo-ios-bundle-id
    paths:
      - .github/workflows/migrate_tokyo_ios_bundle.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-155-tokyo-ios-bundle-id
          fetch-depth: 0

      - name: Apply strict Tokyo iOS-only migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re
          import shutil

          OLD = 'jp.cloxs.toeigo'
          NEW = 'jp.cloxs.go.tokyo'
          NEW_FIREBASE_APP_ID = '1:381461947304:ios:116d95be8afbfc57ed739d'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(path, old, new, expected_count=1):
              text = read(path)
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f'{path}: expected {expected_count} occurrences of {old!r}, found {count}'
                  )
              write(path, text.replace(old, new))

          replace_exact(
              'scripts/configure_ios_flavors.rb',
              "bundle_id: 'jp.cloxs.toeigo',",
              "bundle_id: 'jp.cloxs.go.tokyo',",
          )
          replace_exact(
              'lib/core/city_profile.dart',
              "iosBundleIdentifier: 'jp.cloxs.toeigo',",
              "iosBundleIdentifier: 'jp.cloxs.go.tokyo',",
          )
          replace_exact(
              'test/city_profile_test.dart',
              "expect(profile.distribution.iosBundleIdentifier, 'jp.cloxs.toeigo');",
              "expect(profile.distribution.iosBundleIdentifier, 'jp.cloxs.go.tokyo');",
          )

          firebase_path = 'lib/firebase_options.dart'
          firebase_text = read(firebase_path)
          match = re.search(
              r"  static const FirebaseOptions ios = FirebaseOptions\(\n.*?\n  \);",
              firebase_text,
              flags=re.S,
          )
          if not match:
              raise SystemExit('lib/firebase_options.dart: iOS FirebaseOptions block not found')
          ios_block = match.group(0)
          if ios_block.count("appId: '1:381461947304:ios:ac46fab5ea5c4c0eed739d',") != 1:
              raise SystemExit('lib/firebase_options.dart: unexpected old iOS Firebase appId state')
          if ios_block.count("iosBundleId: 'jp.cloxs.toeigo',") != 1:
              raise SystemExit('lib/firebase_options.dart: unexpected old iOS bundle ID state')
          new_ios_block = ios_block.replace(
              "appId: '1:381461947304:ios:ac46fab5ea5c4c0eed739d',",
              f"appId: '{NEW_FIREBASE_APP_ID}',",
          ).replace(
              "iosBundleId: 'jp.cloxs.toeigo',",
              "iosBundleId: 'jp.cloxs.go.tokyo',",
          )
          firebase_text = firebase_text[:match.start()] + new_ios_block + firebase_text[match.end():]
          write(firebase_path, firebase_text)

          replace_exact(
              '.github/workflows/ci.yml',
              "'jp.cloxs.toeigo'",
              "'jp.cloxs.go.tokyo'",
              expected_count=2,
          )
          replace_exact(
              '.github/workflows/ios_release_build.yml',
              'BUNDLE_ID: jp.cloxs.toeigo',
              'BUNDLE_ID: jp.cloxs.go.tokyo',
          )
          replace_exact(
              '.github/workflows/ios_release_upload.yml',
              'BUNDLE_ID: jp.cloxs.toeigo',
              'BUNDLE_ID: jp.cloxs.go.tokyo',
          )

          release_doc = 'docs/ios-app-store-release.md'
          text = read(release_doc)
          count = text.count(OLD)
          if count < 1:
              raise SystemExit(f'{release_doc}: old iOS bundle ID not found')
          write(release_doc, text.replace(OLD, NEW))

          replace_exact(
              'docs/city-distribution.md',
              '| Tokyo | `tokyo` | `jp.cloxs.toeigo` | `jp.cloxs.toeigo` | existing Tokyo project |',
              '| Tokyo | `tokyo` | `jp.cloxs.toeigo` | `jp.cloxs.go.tokyo` | existing Tokyo project, new iOS app registration |',
          )
          replace_exact(
              'docs/city-distribution.md',
              'Tokyoの既存applicationId / bundle identifierは変更しない。',
              'Tokyo Androidの既存applicationId `jp.cloxs.toeigo` はGoogle Play更新互換のため変更しない。Tokyo iOSは初回App Store登録前に `jp.cloxs.go.tokyo` へ移行した。',
          )
          replace_exact(
              'store/tokyo/README.md',
              '- iOS bundle identifier: `jp.cloxs.toeigo`',
              '- iOS bundle identifier: `jp.cloxs.go.tokyo`',
          )

          plist_path = Path('ios/Runner/GoogleService-Info.plist')
          with plist_path.open('rb') as f:
              plist = plistlib.load(f)
          if plist.get('BUNDLE_ID') != NEW:
              raise SystemExit(
                  f'ios/Runner/GoogleService-Info.plist BUNDLE_ID mismatch: {plist.get("BUNDLE_ID")!r}'
              )
          if plist.get('GOOGLE_APP_ID') != NEW_FIREBASE_APP_ID:
              raise SystemExit('ios/Runner/GoogleService-Info.plist GOOGLE_APP_ID mismatch')
          if plist.get('PROJECT_ID') != 'toeigo':
              raise SystemExit('ios/Runner/GoogleService-Info.plist PROJECT_ID mismatch')

          # Keep the repository-root Firebase plist in sync with the active Tokyo iOS config.
          shutil.copyfile(plist_path, 'GoogleService-Info.plist')

          # Android must remain the already-published Google Play package.
          android_text = read('android/app/build.gradle.kts')
          if 'applicationId = "jp.cloxs.toeigo"' not in android_text:
              raise SystemExit('Android Tokyo applicationId unexpectedly changed')

          # macOS is a separate target and is intentionally not migrated by this iOS change.
          macos_text = read('macos/Runner/GoogleService-Info.plist')
          if '<string>jp.cloxs.toeigo</string>' not in macos_text:
              raise SystemExit('macOS Firebase config changed unexpectedly')
          PY

          ruby scripts/configure_ios_flavors.rb
          ruby scripts/configure_ios_flavors.rb --check

      - name: Validate migration boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "androidApplicationId: 'jp.cloxs.toeigo'" lib/core/city_profile.dart
          grep -Fq "iosBundleIdentifier: 'jp.cloxs.go.tokyo'" lib/core/city_profile.dart
          grep -Fq "bundle_id: 'jp.cloxs.go.tokyo'" scripts/configure_ios_flavors.rb
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = jp.cloxs.go.tokyo;' ios/Runner.xcodeproj/project.pbxproj
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = jp.cloxs.go.tokyo.RunnerTests;' ios/Runner.xcodeproj/project.pbxproj
          grep -Fq "BUNDLE_ID: jp.cloxs.go.tokyo" .github/workflows/ios_release_build.yml
          grep -Fq "BUNDLE_ID: jp.cloxs.go.tokyo" .github/workflows/ios_release_upload.yml

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            scripts/configure_ios_flavors.rb \
            ios/Runner.xcodeproj/project.pbxproj \
            ios/Runner/GoogleService-Info.plist \
            GoogleService-Info.plist \
            lib/firebase_options.dart \
            lib/core/city_profile.dart \
            test/city_profile_test.dart \
            .github/workflows/ci.yml \
            .github/workflows/ios_release_build.yml \
            .github/workflows/ios_release_upload.yml \
            docs/ios-app-store-release.md \
            docs/city-distribution.md \
            store/tokyo/README.md

          if git diff --cached --quiet; then
            echo '::error::Migration produced no tracked changes'
            exit 1
          fi

          git diff --cached --check
          git commit -m 'Migrate Tokyo iOS bundle ID to jp.cloxs.go.tokyo'
          git push origin HEAD:fix/issue-155-tokyo-ios-bundle-id
