name: Migrate Tokyo iOS Bundle ID

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'fix/issue-155-tokyo-ios-bundle-id'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply strict Tokyo iOS-only migration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          OLD = 'jp.cloxs.toeigo'
          NEW = 'jp.cloxs.go.tokyo'
          NEW_FIREBASE_APP_ID = '1:381461947304:ios:116d95be8afbfc57ed739d'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def ensure_replace(path, old, new, expected_old=1, expected_new=1):
              text = read(path)
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == expected_old and new_count == 0:
                  text = text.replace(old, new)
                  write(path, text)
                  return
              if old_count == 0 and new_count == expected_new:
                  return
              raise SystemExit(
                  f'{path}: unexpected migration state: old={old_count}, new={new_count}'
              )

          ensure_replace(
              'scripts/configure_ios_flavors.rb',
              "bundle_id: 'jp.cloxs.toeigo',",
              "bundle_id: 'jp.cloxs.go.tokyo',",
          )

          # These were already changed manually before this generator step.
          city = read('lib/core/city_profile.dart')
          if "androidApplicationId: 'jp.cloxs.toeigo'" not in city:
              raise SystemExit('Tokyo Android applicationId must remain jp.cloxs.toeigo')
          if "iosBundleIdentifier: 'jp.cloxs.go.tokyo'" not in city:
              raise SystemExit('Tokyo iOS CityProfile is not migrated')

          firebase_options = read('lib/firebase_options.dart')
          if "appId: '1:381461947304:ios:116d95be8afbfc57ed739d'" not in firebase_options:
              raise SystemExit('New Tokyo iOS Firebase appId is missing')
          if "iosBundleId: 'jp.cloxs.go.tokyo'" not in firebase_options:
              raise SystemExit('New Tokyo iOS Firebase bundle ID is missing')
          if firebase_options.count("iosBundleId: 'jp.cloxs.toeigo'") != 1:
              raise SystemExit('macOS Firebase configuration must remain on the legacy bundle ID')

          ensure_replace(
              '.github/workflows/ci.yml',
              "'jp.cloxs.toeigo'",
              "'jp.cloxs.go.tokyo'",
              expected_old=2,
              expected_new=2,
          )
          ensure_replace(
              '.github/workflows/ios_release_build.yml',
              'BUNDLE_ID: jp.cloxs.toeigo',
              'BUNDLE_ID: jp.cloxs.go.tokyo',
          )
          ensure_replace(
              '.github/workflows/ios_release_upload.yml',
              'BUNDLE_ID: jp.cloxs.toeigo',
              'BUNDLE_ID: jp.cloxs.go.tokyo',
          )

          release_doc = 'docs/ios-app-store-release.md'
          text = read(release_doc)
          if OLD in text:
              text = text.replace(OLD, NEW)
              write(release_doc, text)
          elif NEW not in text:
              raise SystemExit(f'{release_doc}: neither old nor new iOS Bundle ID found')

          ensure_replace(
              'docs/city-distribution.md',
              '| Tokyo | `tokyo` | `jp.cloxs.toeigo` | `jp.cloxs.toeigo` | existing Tokyo project |',
              '| Tokyo | `tokyo` | `jp.cloxs.toeigo` | `jp.cloxs.go.tokyo` | existing Tokyo project, new iOS app registration |',
          )
          ensure_replace(
              'docs/city-distribution.md',
              'Tokyoの既存applicationId / bundle identifierは変更しない。',
              'Tokyo Androidの既存applicationId `jp.cloxs.toeigo` はGoogle Play更新互換のため変更しない。Tokyo iOSは初回App Store登録前に `jp.cloxs.go.tokyo` へ移行した。',
          )
          ensure_replace(
              'store/tokyo/README.md',
              '- iOS bundle identifier: `jp.cloxs.toeigo`',
              '- iOS bundle identifier: `jp.cloxs.go.tokyo`',
          )

          plist_path = Path('ios/Runner/GoogleService-Info.plist')
          with plist_path.open('rb') as f:
              plist = plistlib.load(f)
          if plist.get('BUNDLE_ID') != NEW:
              raise SystemExit(f'iOS Firebase plist BUNDLE_ID mismatch: {plist.get("BUNDLE_ID")!r}')
          if plist.get('GOOGLE_APP_ID') != NEW_FIREBASE_APP_ID:
              raise SystemExit('iOS Firebase plist GOOGLE_APP_ID mismatch')
          if plist.get('PROJECT_ID') != 'toeigo':
              raise SystemExit('iOS Firebase plist PROJECT_ID mismatch')

          Path('GoogleService-Info.plist').write_bytes(plist_path.read_bytes())

          android = read('android/app/build.gradle.kts')
          if 'applicationId = "jp.cloxs.toeigo"' not in android:
              raise SystemExit('Published Tokyo Android applicationId changed unexpectedly')

          mac_plist = read('macos/Runner/GoogleService-Info.plist')
          if '<string>jp.cloxs.toeigo</string>' not in mac_plist:
              raise SystemExit('macOS Firebase config changed unexpectedly')
          PY

          ruby scripts/configure_ios_flavors.rb
          ruby scripts/configure_ios_flavors.rb --check

      - name: Validate generated migration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "androidApplicationId: 'jp.cloxs.toeigo'" lib/core/city_profile.dart
          grep -Fq "iosBundleIdentifier: 'jp.cloxs.go.tokyo'" lib/core/city_profile.dart
          grep -Fq "bundle_id: 'jp.cloxs.go.tokyo'" scripts/configure_ios_flavors.rb
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = jp.cloxs.go.tokyo;' ios/Runner.xcodeproj/project.pbxproj
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = jp.cloxs.go.tokyo.RunnerTests;' ios/Runner.xcodeproj/project.pbxproj
          grep -Fq "BUNDLE_ID: jp.cloxs.go.tokyo" .github/workflows/ios_release_build.yml
          grep -Fq "BUNDLE_ID: jp.cloxs.go.tokyo" .github/workflows/ios_release_upload.yml

      - name: Commit migration output
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            scripts/configure_ios_flavors.rb \
            ios/Runner.xcodeproj/project.pbxproj \
            GoogleService-Info.plist \
            .github/workflows/ci.yml \
            .github/workflows/ios_release_build.yml \
            .github/workflows/ios_release_upload.yml \
            docs/ios-app-store-release.md \
            docs/city-distribution.md \
            store/tokyo/README.md

          if git diff --cached --quiet; then
            echo '::error::Generator migration produced no changes'
            exit 1
          fi

          git diff --cached --check
          git commit -m 'Complete Tokyo iOS bundle ID migration'
          git push origin HEAD:"$HEAD_BRANCH"
