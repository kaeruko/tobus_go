name: Apply Phase 7 refactors

on:
  push:
    branches:
      - feature/issue-137-sendai-realtime

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-137-sendai-realtime
          fetch-depth: 0

      - name: Apply exact refactors
        run: python scripts/apply_phase7_refactors.py

      - name: Commit patched files
        shell: bash
        run: |
          if git diff --quiet -- api/gtfs_route_backend.py api/app/routes.py; then
            echo 'Expected Phase 7 patch produced no diff.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/gtfs_route_backend.py api/app/routes.py
          git commit -m 'Route Tokyo VehiclePosition through common provider [skip ci]'
          git push origin HEAD:feature/issue-137-sendai-realtime
