name: Sendai staged expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sendai-expansion.yml'
      - 'scripts/inspect_sendai_expansion.py'
      - 'scripts/inspect_sendai_expansion_evidence.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-source-evidence:
    name: Hash official period and Izumi connection evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install existing dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Read the exact reviewed official evidence URLs
        run: |
          python -B scripts/inspect_sendai_expansion_evidence.py
