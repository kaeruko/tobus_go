name: Apply fewTransfers lexicographic fix

on:
  push:
    branches:
      - fix/few-transfers-lexicographic

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/few-transfers-lexicographic
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Apply source patch
        run: python scripts/apply_few_transfers_fix.py

      - name: Install Python API dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt

      - name: Compile changed Python files
        run: python -m py_compile api/toei_engine.py api/tests/test_route_search_regression.py

      - name: Run targeted regression tests
        working-directory: api
        run: python -m unittest discover -s tests -p 'test_route_search_regression.py' -v

      - name: Run all Python API tests
        working-directory: api
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify implementation diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' api/tests/test_route_search_regression.py api/toei_engine.py | sort)"
          if [ "$actual" != "$expected" ]; then
            echo '::error::Unexpected implementation files changed'
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 1
          fi
          git diff -- api/toei_engine.py api/tests/test_route_search_regression.py

      - name: Remove one-shot helpers and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-few-transfers-fix.yml
          rm scripts/apply_few_transfers_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/apply-few-transfers-fix.yml api/tests/test_route_search_regression.py api/toei_engine.py scripts/apply_few_transfers_fix.py | sort)"
          if [ "$actual" != "$expected" ]; then
            echo '::error::Unexpected staged files'
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 1
          fi
          git commit -m 'fix: prioritize boardings for fewTransfers'
          git push origin HEAD:fix/few-transfers-lexicographic
