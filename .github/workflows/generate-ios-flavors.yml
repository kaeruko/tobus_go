name: Generate iOS flavor project

on:
  push:
    branches:
      - feature/issue-136-city-flavors
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-136-city-flavors
          fetch-depth: 0

      - name: Generate Xcode configurations
        run: ruby scripts/configure_ios_flavors.rb

      - name: Commit generated project if changed
        shell: bash
        run: |
          if git diff --quiet -- ios/Runner.xcodeproj/project.pbxproj; then
            echo 'Xcode project already generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Runner.xcodeproj/project.pbxproj
          git commit -m 'Phase 6: generate iOS flavor configurations [skip ci]'
          git push origin HEAD:feature/issue-136-city-flavors
