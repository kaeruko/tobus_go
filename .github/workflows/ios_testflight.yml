name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: jp.cloxs.go.tokyo
  DISPLAY_NAME: 都営でGO
  APP_CITY: tokyo
  EXPECTED_TEAM_ID: H5B52RL9R2
  FLUTTER_VERSION: "3.47.0"
  COCOAPODS_VERSION: "1.16.2"
  BUILD_NUMBER_OFFSET: "100"

jobs:
  build-and-upload:
    name: Build and upload Tokyo to TestFlight
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_26.6.app"
          [[ -d "$XCODE_PATH" ]] || { echo "::error::Required Xcode was not found: $XCODE_PATH"; exit 1; }
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve next TestFlight version and automatic build number
        shell: bash
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::TestFlight releases must be dispatched from main. Got: $GITHUB_REF"
            exit 1
          }

          [[ -f pubspec.yaml ]] || {
            echo "::error::pubspec.yaml was not found"
            exit 1
          }

          VERSION_LINE_COUNT="$(awk '/^version:/{count++} END{print count+0}' pubspec.yaml)"
          [[ "$VERSION_LINE_COUNT" -eq 1 ]] || {
            echo "::error::Expected exactly one top-level version: line in pubspec.yaml, found $VERSION_LINE_COUNT"
            exit 1
          }

          PUBSPEC_VERSION_LINE="$(awk '/^version:/{print; exit}' pubspec.yaml)"
          [[ "$PUBSPEC_VERSION_LINE" =~ ^version:[[:space:]]*([0-9]+(\.[0-9]+){2})\+([1-9][0-9]*)[[:space:]]*$ ]] || {
            echo "::error::Unsupported pubspec version format: $PUBSPEC_VERSION_LINE (expected e.g. version: 1.0.6+28)"
            exit 1
          }

          SOURCE_BUILD_NAME="${BASH_REMATCH[1]}"
          PUBSPEC_BUILD_NUMBER="${BASH_REMATCH[3]}"
          IFS='.' read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$SOURCE_BUILD_NAME"
          BUILD_NAME="$VERSION_MAJOR.$VERSION_MINOR.$((10#$VERSION_PATCH + 1))"

          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
            exit 1
          }

          BUILD_NUMBER="$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))"
          [[ "$BUILD_NUMBER" -gt "$PUBSPEC_BUILD_NUMBER" ]] || {
            echo "::error::Automatic build number must be greater than pubspec build number $PUBSPEC_BUILD_NUMBER. Got: $BUILD_NUMBER"
            exit 1
          }

          echo "SOURCE_BUILD_NAME=$SOURCE_BUILD_NAME" >> "$GITHUB_ENV"
          echo "PUBSPEC_BUILD_NUMBER=$PUBSPEC_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "TestFlight version: $SOURCE_BUILD_NAME -> $BUILD_NAME ($BUILD_NUMBER)"
          echo "### TestFlight build" >> "$GITHUB_STEP_SUMMARY"
          echo "- pubspec.yaml before upload: $SOURCE_BUILD_NAME+$PUBSPEC_BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upload version: $BUILD_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify version against App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          [[ -n "$ASC_KEY_ID" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_API_KEY_ID"; exit 1; }
          [[ -n "$ASC_ISSUER_ID" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_ISSUER_ID"; exit 1; }
          [[ -n "$ASC_API_KEY_P8_BASE64" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_API_KEY_P8_BASE64"; exit 1; }

          ruby <<'RUBY'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'openssl'
          require 'uri'

          def b64url(value)
            Base64.urlsafe_encode64(value, padding: false)
          end

          def semver(value)
            match = /\A(\d+)\.(\d+)\.(\d+)\z/.match(value.to_s)
            abort("Unsupported App Store version format: #{value.inspect}") unless match
            match.captures.map(&:to_i)
          end

          def api_get(url, token)
            uri = URI(url)
            request = Net::HTTP::Get.new(uri)
            request['Authorization'] = "Bearer #{token}"
            response = Net::HTTP.start(
              uri.hostname,
              uri.port,
              use_ssl: true,
              open_timeout: 15,
              read_timeout: 30,
            ) { |http| http.request(request) }

            unless response.is_a?(Net::HTTPSuccess)
              abort(
                "App Store Connect API request failed: " \
                "#{response.code} #{response.message}\n#{response.body}"
              )
            end

            JSON.parse(response.body)
          rescue JSON::ParserError => e
            abort("App Store Connect API returned invalid JSON: #{e.message}")
          end

          key_id = ENV.fetch('ASC_KEY_ID')
          issuer_id = ENV.fetch('ASC_ISSUER_ID')
          private_key_base64 = ENV.fetch('ASC_API_KEY_P8_BASE64')
          bundle_id = ENV.fetch('BUNDLE_ID')
          source_version = ENV.fetch('SOURCE_BUILD_NAME')
          candidate_version = ENV.fetch('BUILD_NAME')

          private_key_pem = Base64.strict_decode64(private_key_base64)
          key = OpenSSL::PKey.read(private_key_pem)
          now = Time.now.to_i
          header = { alg: 'ES256', kid: key_id, typ: 'JWT' }
          payload = {
            iss: issuer_id,
            iat: now - 5,
            exp: now + 600,
            aud: 'appstoreconnect-v1',
          }
          signing_input = [
            b64url(JSON.generate(header)),
            b64url(JSON.generate(payload)),
          ].join('.')

          der_signature = key.sign(OpenSSL::Digest::SHA256.new, signing_input)
          sequence = OpenSSL::ASN1.decode(der_signature)
          unless sequence.is_a?(OpenSSL::ASN1::Sequence) && sequence.value.length == 2
            abort('Could not decode App Store Connect JWT ECDSA signature')
          end
          raw_signature = sequence.value.map do |part|
            hex = part.value.to_i.to_s(16).rjust(64, '0')
            abort('App Store Connect JWT signature component exceeded 32 bytes') if hex.length > 64
            [hex].pack('H*')
          end.join
          token = "#{signing_input}.#{b64url(raw_signature)}"

          apps = api_get(
            "https://api.appstoreconnect.apple.com/v1/apps" \
            "?filter%5BbundleId%5D=#{URI.encode_www_form_component(bundle_id)}&limit=2",
            token,
          )
          app_records = apps.fetch('data')
          unless app_records.is_a?(Array) && app_records.length == 1
            abort(
              "Expected exactly one App Store Connect app for #{bundle_id}, " \
              "found #{app_records.is_a?(Array) ? app_records.length : 'invalid data'}"
            )
          end
          app_id = app_records.first.fetch('id')

          versions = []
          next_url =
            "https://api.appstoreconnect.apple.com/v1/apps/#{app_id}/appStoreVersions" \
            "?filter%5Bplatform%5D=IOS&limit=50"

          while next_url
            page = api_get(next_url, token)
            page_data = page.fetch('data')
            abort('App Store Connect appStoreVersions data is not an array') unless page_data.is_a?(Array)
            versions.concat(page_data)
            next_url = page.dig('links', 'next')
          end

          closed_states = %w[
            ACCEPTED
            PENDING_APPLE_RELEASE
            PENDING_DEVELOPER_RELEASE
            PROCESSING_FOR_DISTRIBUTION
            READY_FOR_DISTRIBUTION
            REPLACED_WITH_NEW_VERSION
          ].freeze
          open_states = %w[
            DEVELOPER_REJECTED
            IN_REVIEW
            INVALID_BINARY
            METADATA_REJECTED
            PREPARE_FOR_SUBMISSION
            READY_FOR_REVIEW
            REJECTED
            WAITING_FOR_EXPORT_COMPLIANCE
            WAITING_FOR_REVIEW
          ].freeze
          known_states = (closed_states + open_states).freeze

          normalized = versions.map do |record|
            attributes = record.fetch('attributes')
            version = attributes.fetch('versionString')
            state = attributes.fetch('appVersionState')
            abort("Unknown Ap Store Connect appVersionState: #{state}") unless known_states.include?(state)
            [version, semver(version), state]
          end

          closed = normalized.select { |_, _, state| closed_states.include?(state) }
          abort('No approved or distributed iOS App Store version was found') if closed.empty?

          latest_closed = closed.max_by { |_, parsed, _| parsed }
          latest_closed_version, latest_closed_semver, latest_closed_state = latest_closed
          source_semver = semver(source_version)
          candidate_semver = semver(candidate_version)

          unless source_semver == latest_closed_semver
            abort(
              "pubspec version is out of sync with App Store Connect: " \
              "pubspec=#{source_version}, latest approved/distributed=" \
              "#{latest_closed_version} (#{latest_closed_state}). " \
              "Update pubspec.yaml before building."
            )
          end

          unless candidate_semver > latest_closed_semver
            abort(
              "Candidate version #{candidate_version} must be newer than " \
              "latest approved/distributed version #{latest_closed_version}"
            )
          end

          newer_records = normalized.select { |_, parsed, _| parsed > candidate_semver }
          unless newer_records.empty?
            details = newer_records
              .sort_by { |_, parsed, _| parsed }
              .map { |version, _, state| "#{version}(#{state})" }
              .join(', ')
            abort(
              "App Store Connect already contains version(s) newer than candidate " \
              "#{candidate_version}: #{details}"
            )
          end

          puts(
            "App Store version preflight passed: " \
            "#{latest_closed_version} (#{latest_closed_state}) -> #{candidate_version}"
          )
          RUBY
      - name: Force CocoaPods plugin integration
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          CONFIG_OUTPUT="$(flutter config --list)"
          printf '%s\n' "$CONFIG_OUTPUT"
          grep -Eq 'enable-swift-package-manager[^a-zA-Z]*(false|disabled)' <<< "$CONFIG_OUTPUT" || {
            echo "::error::Flutter Swift Package Manager is still enabled"
            exit 1
          }

      - name: Validate Tokyo configuration and required secrets
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.IOS_GOOGLE_MAPS_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          ruby scripts/configure_ios_flavors.rb --check
          grep -Fq '<ArchiveAction buildConfiguration="Release-tokyo"' ios/Runner.xcodeproj/xcshareddata/xcschemes/tokyo.xcscheme || {
            echo "::error::Tokyo scheme does not archive Release-tokyo"
            exit 1
          }

          [[ -n "$CERTIFICATE_BASE64" ]] || { echo "::error::Missing secret IOS_DISTRIBUTION_CERTIFICATE_BASE64"; exit 1; }
          [[ -n "$CERTIFICATE_PASSWORD" ]] || { echo "::error::Missing secret IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"; exit 1; }
          [[ -n "$PROVISIONING_PROFILE_BASE64" ]] || { echo "::error::Missing secret IOS_PROVISIONING_PROFILE_BASE64"; exit 1; }
          [[ -n "$GOOGLE_MAPS_IOS_API_KEY" ]] || { echo "::error::Missing secret IOS_GOOGLE_MAPS_API_KEY"; exit 1; }
          [[ -n "$ASC_KEY_ID" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_API_KEY_ID"; exit 1; }
          [[ -n "$ASC_ISSUER_ID" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_ISSUER_ID"; exit 1; }
          [[ -n "$ASC_API_KEY_P8_BASE64" ]] || { echo "::error::Missing secret APP_STORE_CONNECT_API_KEY_P8_BASE64"; exit 1; }

      - name: Install and validate signing material
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/distribution.pem"
          CERTIFICATE_DER="$RUNNER_TEMP/distribution.der"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"
          [[ -s "$CERTIFICATE_PATH" ]] || { echo "::error::Decoded signing certificate is empty"; exit 1; }
          [[ -s "$PROFILE_PATH" ]] || { echo "::error::Decoded provisioning profile is empty"; exit 1; }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$IDENTITIES"
          grep -Fq 'Apple Distribution: CLOXS LLC' <<< "$IDENTITIES" || {
            echo "::error::Expected Apple Distribution: CLOXS LLC identity was not found in the supplied .p12"
            exit 1
          }

          security find-certificate -p -c 'Apple Distribution: CLOXS LLC' "$KEYCHAIN_PATH" > "$CERTIFICATE_PEM"
          [[ -s "$CERTIFICATE_PEM" ]] || { echo "::error::Could not export Apple Distribution certificate"; exit 1; }
          openssl x509 -in "$CERTIFICATE_PEM" -outform DER -out "$CERTIFICATE_DER"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST")"

          [[ -n "$PROFILE_UUID" ]] || { echo "::error::Provisioning profile UUID is empty"; exit 1; }
          [[ -n "$PROFILE_NAME" ]] || { echo "::error::Provisioning profile name is empty"; exit 1; }
          [[ "$TEAM_ID" == "$EXPECTED_TEAM_ID" ]] || { echo "::error::Provisioning profile Team ID mismatch. Expected $EXPECTED_TEAM_ID, got $TEAM_ID"; exit 1; }
          [[ "$APP_ID" == "$EXPECTED_TEAM_ID.$BUNDLE_ID" ]] || { echo "::error::Provisioning profile app id mismatch. Expected $EXPECTED_TEAM_ID.$BUNDLE_ID, got $APP_ID"; exit 1; }
          [[ "$GET_TASK_ALLOW" == "false" ]] || { echo "::error::Provisioning profile is not App Store distribution (get-task-allow=$GET_TASK_ALLOW)"; exit 1; }

          PROFILE_PLIST="$PROFILE_PLIST" CERTIFICATE_DER="$CERTIFICATE_DER" python3 - <<'PY'
          import datetime
          import os
          import plistlib

          with open(os.environ['PROFILE_PLIST'], 'rb') as f:
              profile = plistlib.load(f)
          with open(os.environ['CERTIFICATE_DER'], 'rb') as f:
              certificate = f.read()

          developer_certificates = profile.get('DeveloperCertificates')
          if not isinstance(developer_certificates, list) or certificate not in developer_certificates:
              raise SystemExit('Provisioning profile does not contain the Apple Distribution certificate imported into the CI keychain')

          expires = profile.get('ExpirationDate')
          if not isinstance(expires, datetime.datetime):
              raise SystemExit('Provisioning profile ExpirationDate is missing or invalid')
          now = datetime.datetime.now(datetime.timezone.utc)
          if expires.tzinfo is None:
              expires = expires.replace(tzinfo=datetime.timezone.utc)
          if expires <= now:
              raise SystemExit(f'Provisioning profile is expired: {expires.isoformat()}')
          PY

          INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$INSTALL_DIR"
          INSTALLED_PROFILE_PATH="$INSTALL_DIR/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_PATH" "$INSTALLED_PROFILE_PATH"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "INSTALLED_PROFILE_PATH=$INSTALLED_PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Resolve dependencies and test
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
          ruby scripts/configure_ios_flavors.rb --check

      - name: Install CocoaPods 1.16.2 and refresh specs
        shell: bash
        run: |
          set -euo pipefail
          gem install cocoapods -v "$COCOAPODS_VERSION" --no-document

          POD_LAUNCHER="$(command -v pod)"
          ACTUAL_COCOAPODS_VERSION="$("$POD_LAUNCHER" "_${COCOAPODS_VERSION}_" --version)"
          [[ "$ACTUAL_COCOAPODS_VERSION" == "$COCOAPODS_VERSION" ]] || {
            echo "::error::Expected CocoaPods $COCOAPODS_VERSION, got $ACTUAL_COCOAPODS_VERSION"
            exit 1
          }

          "$POD_LAUNCHER" "_${COCOAPODS_VERSION}_" repo update

          WRAPPER_DIR="$RUNNER_TEMP/cocoapods-$COCOAPODS_VERSION-bin"
          mkdir -p "$WRAPPER_DIR"
          cat > "$WRAPPER_DIR/pod" <<EOF
          #!/bin/bash
          exec "$POD_LAUNCHER" "_${COCOAPODS_VERSION}_" "\$@"
          EOF
          chmod +x "$WRAPPER_DIR/pod"
          echo "$WRAPPER_DIR" >> "$GITHUB_PATH"

      - name: Generate Tokyo release configuration
        shell: bash
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --flavor tokyo \
            --dart-define="APP_CITY=$APP_CITY" \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER" \
            --config-only \
            --no-codesign

          GENERATED_XCCONFIG="ios/Flutter/Generated.xcconfig"
          [[ -f "$GENERATED_XCCONFIG" ]] || { echo "::error::Generated.xcconfig was not created"; exit 1; }

          GENERATED_XCCONFIG="$GENERATED_XCCONFIG" python3 - <<'PY'
          import base64
          import os

          path = os.environ['GENERATED_XCCONFIG']
          values = {}
          with open(path, encoding='utf-8') as f:
              for raw in f:
                  line = raw.rstrip('\n')
                  if '=' in line:
                      key, value = line.split('=', 1)
                      values[key] = value

          encoded = values.get('DART_DEFINES')
          if not encoded:
              raise SystemExit('Generated.xcconfig is missing DART_DEFINES')

          decoded = []
          for item in encoded.split(','):
              try:
                  decoded.append(base64.b64decode(item).decode('utf-8'))
              except Exception as exc:
                  raise SystemExit(f'Could not decode DART_DEFINES entry: {exc}') from exc

          expected = {f"APP_CITY={os.environ['APP_CITY']}"}
          missing = expected.difference(decoded)
          if missing:
              raise SystemExit(f'Generated iOS configuration is missing required Dart defines: {sorted(missing)}')
          if any(item.startswith('API_BASE=') for item in decoded):
              raise SystemExit('Release build must not embed API_BASE; the city endpoint is resolved from Google Drive at runtime')
          PY

      - name: Install iOS pod dependencies
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_COCOAPODS_VERSION="$(pod --version)"
          [[ "$ACTUAL_COCOAPODS_VERSION" == "$COCOAPODS_VERSION" ]] || {
            echo "::error::Expected CocoaPods $COCOAPODS_VERSION, got $ACTUAL_COCOAPODS_VERSION"
            exit 1
          }
          cd ios
          pod install
          cd ..
          ruby scripts/configure_ios_flavors.rb
          ruby scripts/configure_ios_flavors.rb --check

      - name: Configure Release-tokyo signing on Runner only
        shell: bash
        run: |
          set -euo pipefail
          export TEAM_ID PROFILE_NAME BUNDLE_ID
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          abort('Runner target was not found') unless runner

          config = runner.build_configurations.find { |item| item.name == 'Release-tokyo' }
          abort('Runner Release-tokyo configuration was not found') unless config

          config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM_ID')
          config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
          config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
          config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE_ID')
          project.save
          RUBY

          SETTINGS="$(xcodebuild -project ios/Runner.xcodeproj -target Runner -configuration Release-tokyo -showBuildSettings)"
          grep -Fq "DEVELOPMENT_TEAM = $TEAM_ID" <<< "$SETTINGS" || { echo "::error::Runner Release-tokyo DEVELOPMENT_TEAM mismatch"; exit 1; }
          grep -Fq 'CODE_SIGN_STYLE = Manual' <<< "$SETTINGS" || { echo "::error::Runner Release-tokyo is not using manual signing"; exit 1; }
          grep -Fq 'CODE_SIGN_IDENTITY = Apple Distribution' <<< "$SETTINGS" || { echo "::error::Runner Release-tokyo signing identity mismatch"; exit 1; }
          grep -Fq "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME" <<< "$SETTINGS" || { echo "::error::Runner Release-tokyo provisioning profile mismatch"; exit 1; }
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID" <<< "$SETTINGS" || { echo "::error::Runner Release-tokyo bundle identifier mismatch"; exit 1; }
          grep -Fq "FLUTTER_BUILD_NAME = $BUILD_NAME" <<< "$SETTINGS" || { echo "::error::Runner Release-tokyo FLUTTER_BUILD_NAME mismatch"; exit 1; }
          grep -Fq "FLUTTER_BUILD_NUMBER = $BUILD_NUMBER" <<< "$SETTINGS" || { echo "::error::Runner Release-tokyo FLUTTER_BUILD_NUMBER mismatch"; exit 1; }

      - name: Archive signed Tokyo app
        shell: bash
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.IOS_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$GOOGLE_MAPS_IOS_API_KEY" ]] || { echo "::error::Missing secret IOS_GOOGLE_MAPS_API_KEY"; exit 1; }

          ARCHIVE_PATH="$RUNNER_TEMP/Runner-tokyo.xcarchive"
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme tokyo \
            -configuration Release-tokyo \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GOOGLE_MAPS_IOS_API_KEY="$GOOGLE_MAPS_IOS_API_KEY" \
            archive

          [[ -d "$ARCHIVE_PATH" ]] || { echo "::error::Archive was not created: $ARCHIVE_PATH"; exit 1; }

          ARCHIVE_APP_INFO="$ARCHIVE_PATH/Products/Applications/Runner.app/Info.plist"
          [[ -f "$ARCHIVE_APP_INFO" ]] || { echo "::error::Archived Runner Info.plist was not found"; exit 1; }
          ARCHIVE_APP_BUILD_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$ARCHIVE_APP_INFO")"
          ARCHIVE_APP_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVE_APP_INFO")"
          [[ "$ARCHIVE_APP_BUILD_NAME" == "$BUILD_NAME" ]] || { echo "::error::Archived app version mismatch. Expected $BUILD_NAME, got $ARCHIVE_APP_BUILD_NAME"; exit 1; }
          [[ "$ARCHIVE_APP_BUILD_NUMBER" == "$BUILD_NUMBER" ]] || { echo "::error::Archived app build number mismatch. Expected $BUILD_NUMBER, got $ARCHIVE_APP_BUILD_NUMBER"; exit 1; }

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export and verify signed Tokyo IPA
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_PATH="$RUNNER_TEMP/export"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          EOF

          plutil -lint "$EXPORT_OPTIONS"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          shopt -s nullglob
          IPA_FILES=("$EXPORT_PATH"/*.ipa)
          [[ "${#IPA_FILES[@]}" -eq 1 ]] || { echo "::error::Expected exactly one IPA, found ${#IPA_FILES[@]}"; exit 1; }
          IPA_PATH="${IPA_FILES[0]}"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_DIRS=("$VERIFY_DIR"/Payload/*.app)
          [[ "${#APP_DIRS[@]}" -eq 1 && -d "${APP_DIRS[0]}" ]] || { echo "::error::Expected exactly one .app in IPA"; exit 1; }
          APP_DIR="${APP_DIRS[0]}"
          APP_INFO="$APP_DIR/Info.plist"

          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")"
          ACTUAL_DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_INFO")"
          ACTUAL_BUILD_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")"
          ACTUAL_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")"
          LOCATION_USAGE="$(/usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$APP_INFO")"
          MAPS_API_KEY="$(/usr/libexec/PlistBuddy -c 'Print :GoogleMapsApiKey' "$APP_INFO")"

          [[ "$ACTUAL_BUNDLE_ID" == "$BUNDLE_ID" ]] || { echo "::error::IPA bundle id mismatch: $ACTUAL_BUNDLE_ID"; exit 1; }
          [[ "$ACTUAL_DISPLAY_NAME" == "$DISPLAY_NAME" ]] || { echo "::error::IPA display name mismatch: $ACTUAL_DISPLAY_NAME"; exit 1; }
          [[ "$ACTUAL_BUILD_NAME" == "$BUILD_NAME" ]] || { echo "::error::IPA version mismatch. Expected $BUILD_NAME, got $ACTUAL_BUILD_NAME"; exit 1; }
          [[ "$ACTUAL_BUILD_NUMBER" == "$BUILD_NUMBER" ]] || { echo "::error::IPA build number mismatch. Expected $BUILD_NUMBER, got $ACTUAL_BUILD_NUMBER"; exit 1; }
          [[ -n "$LOCATION_USAGE" ]] || { echo "::error::NSLocationWhenInUseUsageDescription is missing"; exit 1; }
          [[ -n "$MAPS_API_KEY" && "$MAPS_API_KEY" != '$(GOOGLE_MAPS_IOS_API_KEY)' ]] || { echo "::error::GoogleMapsApiKey was not resolved in exported IPA"; exit 1; }

          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$APP_INFO" >/dev/null 2>&1; then
            echo "::error::Exported App Store IPA enables NSAllowsArbitraryLoads"
            exit 1
          fi

          FIREBASE_PLIST="$APP_DIR/GoogleService-Info.plist"
          [[ -f "$FIREBASE_PLIST" ]] || { echo "::error::Tokyo Firebase resource is missing from IPA"; exit 1; }
          FIREBASE_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$FIREBASE_PLIST")"
          FIREBASE_PROJECT_ID="$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$FIREBASE_PLIST")"
          [[ "$FIREBASE_BUNDLE_ID" == "$BUNDLE_ID" ]] || { echo "::error::Tokyo Firebase BUNDLE_ID mismatch: $FIREBASE_BUNDLE_ID"; exit 1; }
          [[ "$FIREBASE_PROJECT_ID" == 'toeigo' ]] || { echo "::error::Tokyo Firebase PROJECT_ID mismatch: $FIREBASE_PROJECT_ID"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          SIGNING_DETAILS="$(codesign -dv --verbose=4 "$APP_DIR" 2>&1)"
          grep -Fq 'Authority=Apple Distribution: CLOXS LLC' <<< "$SIGNING_DETAILS" || { echo "::error::IPA signing authority mismatch"; exit 1; }
          grep -Fq "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$SIGNING_DETAILS" || { echo "::error::IPA TeamIdentifier mismatch"; exit 1; }

          echo "Verified Tokyo IPA: $ACTUAL_BUNDLE_ID $ACTUAL_BUILD_NAME ($ACTUAL_BUILD_NUMBER)"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: toeigo-ios-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Install App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | /usr/bin/base64 -D > "$API_KEY_PATH"
          [[ -s "$API_KEY_PATH" ]] || { echo "::error::Decoded App Store Connect API key is empty"; exit 1; }
          grep -q 'BEGIN PRIVATE KEY' "$API_KEY_PATH" || { echo "::error::App Store Connect secret did not decode to a .p8 key"; exit 1; }
          chmod 600 "$API_KEY_PATH"

      - name: Upload to TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          [[ -f "$IPA_PATH" ]] || { echo "::error::IPA not found: $IPA_PATH"; exit 1; }

          xcrun altool \
            --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Persist successful TestFlight version
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout -B main origin/main

          VERSION_LINE_COUNT="$(awk '/^version:/{count++} END{print count+0}' pubspec.yaml)"
          [[ "$VERSION_LINE_COUNT" -eq 1 ]] || {
            echo "::error::Expected exactly one top-level version: line in pubspec.yaml, found $VERSION_LINE_COUNT"
            exit 1
          }

          CURRENT_VERSION_LINE="$(awk '/^version:/{print; exit}' pubspec.yaml)"
          [[ "$CURRENT_VERSION_LINE" =~ ^version:[[:space:]]*([0-9]+(\.[0-9]+){2})\+([1-9][0-9]*)[[:space:]]*$ ]] || {
            echo "::error::Unsupported current pubspec version format: $CURRENT_VERSION_LINE"
            exit 1
          }

          CURRENT_BUILD_NAME="${BASH_REMATCH[1]}"
          CURRENT_PUBSPEC_BUILD_NUMBER="${BASH_REMATCH[3]}"

          if [[ "$CURRENT_BUILD_NAME" == "$BUILD_NAME" ]]; then
            echo "pubspec.yaml is already at $BUILD_NAME; no version commit is needed."
            exit 0
          fi

          [[ "$CURRENT_BUILD_NAME" == "$SOURCE_BUILD_NAME" ]] || {
            echo "::error::pubspec version changed while TestFlight was building. Expected $SOURCE_BUILD_NAME or $BUILD_NAME, got $CURRENT_BUILD_NAME"
            exit 1
          }
          [[ "$CURRENT_PUBSPEC_BUILD_NUMBER" == "$PUBSPEC_BUILD_NUMBER" ]] || {
            echo "::error::pubspec build number changed while TestFlight was building. Expected $PUBSPEC_BUILD_NUMBER, got $CURRENT_PUBSPEC_BUILD_NUMBER"
            exit 1
          }

          SOURCE_BUILD_NAME="$SOURCE_BUILD_NAME" \
          BUILD_NAME="$BUILD_NAME" \
          PUBSPEC_BUILD_NUMBER="$PUBSPEC_BUILD_NUMBER" \
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"^version:\s*"
              + re.escape(os.environ["SOURCE_BUILD_NAME"])
              + r"\+"
              + re.escape(os.environ["PUBSPEC_BUILD_NUMBER"])
              + r"\s*$",
              re.MULTILINE,
          )
          updated, count = pattern.subn(
              f"version: {os.environ['BUILD_NAME']}+{os.environ['PUBSPEC_BUILD_NUMBER']}",
              text,
          )
          if count != 1:
              raise SystemExit(
                  f"Expected to replace exactly one pubspec version line, replaced {count}"
              )
          path.write_text(updated, encoding="utf-8")
          PY

          EXPECTED_VERSION_LINE="version: $BUILD_NAME+$PUBSPEC_BUILD_NUMBER"
          ACTUAL_VERSION_LINE="$(awk '/^version:/{print; exit}' pubspec.yaml)"
          [[ "$ACTUAL_VERSION_LINE" == "$EXPECTED_VERSION_LINE" ]] || {
            echo "::error::pubspec version update mismatch. Expected '$EXPECTED_VERSION_LINE', got '$ACTUAL_VERSION_LINE'"
            exit 1
          }

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git diff --cached --quiet && {
            echo "::error::Expected pubspec.yaml version change, but no staged diff was produced"
            exit 1
          }
          git commit -m "Bump app version to $BUILD_NAME"
          git push origin HEAD:main

          echo "- Persisted pubspec.yaml: $BUILD_NAME+$PUBSPEC_BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INSTALLED_PROFILE_PATH:-}" && -f "$INSTALLED_PROFILE_PATH" ]]; then
            rm -f "$INSTALLED_PROFILE_PATH"
          fi
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" \
                "$RUNNER_TEMP/distribution.pem" \
                "$RUNNER_TEMP/distribution.der" \
                "$RUNNER_TEMP/profile.mobileprovision" \
                "$RUNNER_TEMP/profile.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys"
